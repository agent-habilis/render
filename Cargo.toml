[workspace]
members = ["tasks"]
# Vendored dependency (see [patch.crates-io]); built as a dep, not a member, so
# our workspace lints and `--workspace` builds/tests skip the third-party code.
exclude = ["vendor/figurehead"]

# Shared package fields. The crate opts in with `edition.workspace = true`
# / `rust-version.workspace = true` so the workspace stays in lockstep on
# toolchain expectations.
[workspace.package]
edition = "2024"
rust-version = "1.95"

# `rust_2018_idioms` is the only idioms group and is still correct on
# edition 2024 (bare_trait_objects, elided_lifetimes_in_paths, ...).
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# No unsafe in this crate (pure stdin->stdout); forbid drift.
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"
# Reject non-ASCII identifiers (homoglyph / supply-chain hardening).
non_ascii_idents = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Cargo.toml hygiene (metadata, wildcard deps, feature names, ...).
cargo = { level = "warn", priority = -1 }
# Cherry-picked restriction lints that aid readability.
min_ident_chars = "warn"
shadow_unrelated = "warn"
semicolon_inside_block = "warn"
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
# A new enum variant must be handled explicitly, not swallowed by `_ =>`.
wildcard_enum_match_arm = "warn"
# Documented opt-outs (noise / not controllable from a leaf binary).
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

[package]
name = "agent-habilis-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "render diagrams and documents as terminal text"
license = "MIT"
repository = "https://github.com/agent-habilis/render"
homepage = "https://github.com/agent-habilis/render"
readme = "README.md"
keywords = ["mermaid", "diagram", "ascii", "terminal", "cli"]
categories = ["command-line-utilities", "visualization"]
# Release/CI scaffolding is not part of the crate payload.
exclude = ["Formula/", ".github/"]

[lints]
workspace = true

[lib]
name = "agent_habilis_render"
path = "src/lib.rs"

[[bin]]
name = "ahre"
path = "src/main.rs"

[dependencies]
figurehead = "0.4"
termimad = "0.34"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
crossterm = "0.29"
console = "0.16"
tui-term = "0.3.4"
ratatui = "0.30.1"
portable-pty = "0.9.0"
ansi-to-tui = "8.0.1"
vt100 = "0.16.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
csv = "1.4.0"
comfy-table = "7.2.2"
ratatui-image = { version = "11.0.4", default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
# Drives the `.ahr-deck` integration test through a real pseudo-terminal.
portable-pty = "0.9.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.release]
publish = false
push = false
tag-name = "v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
allow-branch = ["main"]

# Local fork of figurehead 0.4.3 with a self-message layout fix upstream hasn't
# shipped (panics on `sequenceDiagram` self-messages). See vendor/figurehead/VENDORING.md.
[patch.crates-io]
figurehead = { path = "vendor/figurehead" }

[package]
name = "tasks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Project task runner for agent-habilis-render (cargo task ...)"
publish = false

[dependencies]
# Mirrors the root crate's clap (already in Cargo.lock, so no new toolchain
# install). xshell is the only net-new crate; cargo compiles it as a library.
clap = { version = "4", features = ["derive"] }
xshell = "0.2"

[lints]
workspace = true
